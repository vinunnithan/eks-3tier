image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

mysql:
  database: transactions
  username: admin
  password: ""       # supply via --set at install time, never commit a real value here
  rootPassword: ""   # supply via --set at install time, never commit a real value here

storage:
  storageClassName: ebs-gp3
  size: 10Gi

service:
  port: 3306

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi